name: Repro PR 819 macOS

on:
  push:
    branches: ["tmp/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  variants:
    name: Test variants (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Probe git versions and gitfile contents
        run: |
          set -x
          uname -m
          echo "PATH git: $(command -v git) $(git --version)"
          echo "Apple git: $(/usr/bin/git --version 2>&1 || echo none)"
          for g in "$(command -v git)" /usr/bin/git; do
            [ -x "$g" ] || continue
            echo "=== gitfile written by $g ==="
            tmp=$(mktemp -d)
            "$g" init -q -b main --separate-git-dir "$tmp/repo.git" "$tmp/repo"
            cat "$tmp/repo/.git"
            rm -rf "$tmp"
          done

      - name: Build test binary
        run: |
          cargo test --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "tuicr") | .executable' \
            | tee /tmp/testbin.txt
          cargo build -q --example gitlink_probe

      - name: Run scenarios
        run: |
          set -u
          testbin=$(head -1 /tmp/testbin.txt)
          echo "test binary: $testbin"

          mkdir -p /tmp/gitshim
          ln -sf /usr/bin/git /tmp/gitshim/git || true

          mkdir -p "$HOME/real-tmp"
          ln -sfn "$HOME/real-tmp" "$HOME/link-tmp"

          run() {
            label="$1"; shift
            echo "::group::scenario: $label"
            if "$@" "$testbin" --exact --nocapture \
              vcs::git::libgit2::tests::should_resolve_worktree_for_separate_git_dir; then
              echo "RESULT $label: PASS"
            else
              echo "RESULT $label: FAIL"
            fi
            echo "::endgroup::"
          }

          probe() {
            label="$1"; shift
            echo "::group::probe: $label"
            "$@" target/debug/examples/gitlink_probe || true
            echo "::endgroup::"
          }

          echo "## default"
          echo "TMPDIR=${TMPDIR:-<unset>}"
          run "default" env
          probe "default" env

          echo "## TMPDIR=/tmp"
          run "tmpdir-/tmp" env TMPDIR=/tmp
          probe "tmpdir-/tmp" env TMPDIR=/tmp

          echo "## TMPDIR=$HOME/link-tmp (symlinked)"
          run "tmpdir-symlink" env TMPDIR="$HOME/link-tmp"
          probe "tmpdir-symlink" env TMPDIR="$HOME/link-tmp"

          echo "## Apple git shim, default TMPDIR"
          run "apple-git" env PATH="/tmp/gitshim:$PATH"

      - name: System libgit2 variant
        if: runner.os == 'macOS'
        run: |
          set -u
          if ! command -v pkg-config >/dev/null; then
            echo "RESULT system-libgit2: skipped (no pkg-config)"
            exit 0
          fi
          brew install libgit2 || true
          echo "system libgit2: $(pkg-config --modversion libgit2 2>&1 || echo not-found)"
          testbin=$(head -1 /tmp/testbin.txt)
          LIBGIT2_SYS_USE_PKG_CONFIG=1 LIBGIT2_NO_VENDOR=1 cargo test --lib --no-run \
            --message-format=json 2>&1 | tail -5 || true
          LIBGIT2_SYS_USE_PKG_CONFIG=1 LIBGIT2_NO_VENDOR=1 cargo build -q --example gitlink_probe || true
          target/debug/examples/gitlink_probe || true
          if "$testbin" --exact --nocapture \
            vcs::git::libgit2::tests::should_resolve_worktree_for_separate_git_dir; then
            echo "RESULT system-libgit2: PASS"
          else
            echo "RESULT system-libgit2: FAIL"
          fi